@media(prefers-color-scheme:dark){:root{--bg:#0f1621;--card:#18212f;--ink:#e8edf5;--mute:#9aa8bd;--acc:#3fb88a;--acc2:#16322a;--bad:#ff8a80;--line:#2a3547;--star:#f0b44c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0}h2{font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:10px 16px;margin:4px 4px 4px 0}
button.ghost{background:transparent;color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:6px 0}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--acc);background:var(--acc2)}
.opt.no{border-color:var(--bad)}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid var(--line)}
.timer{font-size:1.3rem;font-weight:bold}.timer.low{color:var(--bad)}
.tag{font-size:.8rem;color:var(--mute)}.star{color:var(--star)}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.nav button{padding:4px 8px;margin:0;background:var(--card);color:var(--ink);border-color:var(--line);font-size:.85rem}
.nav button.done{background:var(--acc2);border-color:var(--acc)}
.nav button.cur{outline:2px solid var(--star)}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.big{font-size:2.4rem;font-weight:bold;color:var(--acc)}
.hide{display:none}
</style>
</head>

Q.push(...(window.EXTRA||[]));
/* ============ TEST SETTINGS ============ */
const TEST_RULES = {GK:20, English:20, commerceTotal:60};
const COMMERCE = ["Accounting","Business Math","Economics","Commerce","Statistics"];
const MINUTES = 60;          // test ka total time (minutes) – yahan badal sakte ho
const NEG_MARK = 0;          // galat jawab pe minus (0 = nahi, 0.25 = ek chautai)
const EXPECTED_BOOST = 3;    // expected sawal ka random chance kitna zyada ho

const $ = s => document.querySelector(s);
const app = $("#app");
let T = null, tick = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Weighted random pick: expected questions zyada chance se aate hain
function weightedPick(pool,n){
  const out=[],p=pool.slice();
  while(out.length<n && p.length){
    const w=p.map(q=>q[4]?EXPECTED_BOOST:1),tot=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot,i=0;
    while(r>=w[i]){r-=w[i];i++}
    out.push(p.splice(i,1)[0]);
  }
  return out;
}
function buildTest(){
  const pick=s=>weightedPick(Q.filter(q=>q[0]===s),TEST_RULES[s]);
  const com=weightedPick(Q.filter(q=>COMMERCE.includes(q[0])),TEST_RULES.commerceTotal);
  // har sawal ke options bhi shuffle
  return [...pick("GK"),...pick("English"),...com].map(q=>{
    const idx=shuffle([0,1,2,3].slice(0,q[2].length));
    return {s:q[0],q:q[1],o:idx.map(i=>q[2][i]),a:idx.indexOf(q[3]),x:q[4]};
  });
}

function home(){
  clearInterval(tick);
  const cnt={};Q.forEach(q=>cnt[q[0]]=(cnt[q[0]]||0)+1);
  app.innerHTML=`<h1>KU Entry Test Practice</h1>
  <p class="tag">BBA / BSPA – Karachi University | GK 20 · English 20 · Commerce 60 = 100 MCQs</p>
  <div class="card"><h2>📖 Study Mode</h2><p>Browse questions with answers and memorise them.</p>
  <select id="sub"><option value="all">All subjects</option>${[...new Set(Q.map(q=>q[0]))].map(s=>`<option>${s}</option>`).join("")}</select>
  <label><input type="checkbox" id="exp"> ★ Expected only</label><br>
  <button onclick="study()">Start studying</button></div>
  <div class="card"><h2>📝 Mock Test</h2><p>${MINUTES} minutes, random questions (★ expected ones appear more often). The test submits automatically when time is up.</p>
  <button onclick="startTest()">Start test</button></div>
  <div class="card tag">The bank has ${Q.length} questions. A full 100-question test needs at least 20 GK, 20 English and 60 commerce questions. Add more inside the <b>EXTRA</b> lists in index.html.<br>${Object.entries(cnt).map(([k,v])=>k+": "+v).join(" · ")}</div>`;
}

function study(){
  const s=$("#sub").value,e=$("#exp").checked;
  const list=Q.filter(q=>(s==="all"||q[0]===s)&&(!e||q[4]));
  app.innerHTML=`<button class="ghost" onclick="home()">← Back</button><h1>Study (${list.length})</h1>`+
  list.map((q,i)=>`<div class="card"><span class="tag">${q[0]} ${q[4]?'<span class="star">★ expected</span>':''}</span>
  <p><b>${i+1}. ${q[1]}</b></p>${q[2].map((o,j)=>`<div>${"ABCD"[j]}. ${o}${j===q[3]?' ✅':''}</div>`).join("")}</div>`).join("");
}

function startTest(){
  const qs=buildTest();
  T={qs,ans:Array(qs.length).fill(null),cur:0,end:Date.now()+MINUTES*60000,done:false};
  tick=setInterval(()=>{
    const left=Math.max(0,T.end-Date.now());
    const el=$("#tm");
    if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<5*60000)}
    if(left<=0)finish(true);
  },500);
  render();
}
function render(){
  if(T.done)return;
  const q=T.qs[T.cur];
  app.innerHTML=`<div class="bar"><span>Q ${T.cur+1}/${T.qs.length}</span><span class="timer" id="tm"></span><button onclick="confirmFinish()">Submit</button></div>
  <div class="card"><span class="tag">${q.s}</span><p><b>${q.q}</b></p>
  ${q.o.map((o,j)=>`<button class="opt ${T.ans[T.cur]===j?'sel':''}" onclick="pick(${j})">${"ABCD"[j]}. ${o}</button>`).join("")}
  <button class="ghost" onclick="go(-1)">← Previous</button><button class="ghost" onclick="clr()">Clear</button><button onclick="go(1)">Next →</button></div>
  <div class="nav">${T.qs.map((_,i)=>`<button class="${T.ans[i]!==null?'done':''} ${i===T.cur?'cur':''}" onclick="T.cur=${i};render()">${i+1}</button>`).join("")}</div>`;
}
function pick(j){T.ans[T.cur]=j;render()}
function clr(){T.ans[T.cur]=null;render()}
function go(d){T.cur=Math.min(T.qs.length-1,Math.max(0,T.cur+d));render()}
function confirmFinish(){
  const un=T.ans.filter(a=>a===null).length;
  if(confirm(un?`${un} question(s) still unanswered. Submit anyway?`:"Submit the test?"))finish(false);
}
function finish(timeUp){
  if(T.done)return;T.done=true;clearInterval(tick);
  let ok=0,bad=0,skip=0;const by={};
  T.qs.forEach((q,i)=>{
    by[q.s]=by[q.s]||{t:0,c:0};by[q.s].t++;
    if(T.ans[i]===null)skip++;else if(T.ans[i]===q.a){ok++;by[q.s].c++}else bad++;
  });
  const score=ok-bad*NEG_MARK;
  app.innerHTML=`<h1>Result ${timeUp?'<span class="tag">(time up)</span>':''}</h1>
  <div class="card"><div class="big">${score} / ${T.qs.length}</div>
  <p>✅ Correct: ${ok} · ❌ Wrong: ${bad} · ⏭ Skipped: ${skip} · ${Math.round(score/T.qs.length*100)}%</p>
  ${Object.entries(by).map(([s,v])=>`<div>${s}: ${v.c}/${v.t}</div>`).join("")}
  <button onclick="startTest()">Retake test</button><button class="ghost" onclick="home()">Home</button></div>
  <h2>Review</h2>`+T.qs.map((q,i)=>`<div class="card"><span class="tag">${q.s} ${q.x?'<span class="star">★</span>':''}</span>
  <p><b>${i+1}. ${q.q}</b></p>${q.o.map((o,j)=>`<div class="opt ${j===q.a?'ok':(j===T.ans[i]?'no':'')}" style="padding:6px 10px">${"ABCD"[j]}. ${o}${j===q.a?' ✅':''}${j===T.ans[i]&&j!==q.a?' ❌ (your answer)':''}</div>`).join("")}</div>`).join("");
  window.scrollTo(0,0);
}
window.addEventListener("beforeunload",e=>{if(T&&!T.done){e.preventDefault();e.returnValue=""}});
home();
</script>
